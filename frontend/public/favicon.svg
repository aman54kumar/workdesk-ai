<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="WorkDesk AI">
  <defs>
    <linearGradient id="wd-bg" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="wd-shine" x1="2" y1="2" x2="18" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Indigo gradient background -->
  <rect width="32" height="32" rx="8" fill="url(#wd-bg)"/>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#wd-shine)"/>
  <!-- Stacked card layers — back to front -->
  <rect x="11" y="6"  width="14" height="10" rx="2"   fill="#a5b4fc" fill-opacity=".45"/>
  <rect x="9"  y="10" width="14" height="10" rx="2"   fill="#c7d2fe" fill-opacity=".72"/>
  <rect x="7"  y="14" width="14" height="10" rx="2.5" fill="#fff"    fill-opacity=".96"/>
  <!-- Content lines on front card -->
  <path d="M9.5 17.5h9.5M9.5 20.5h6" stroke="#6366f1" stroke-width="1.3" stroke-linecap="round"/>
  <!-- AI sparkle — 4-point star, top-right -->
  <path d="M23.5 4 L24.4 6.6 L27 7.5 L24.4 8.4 L23.5 11 L22.6 8.4 L20 7.5 L22.6 6.6 Z" fill="#fff"/>
</svg>
